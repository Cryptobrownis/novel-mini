<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sketsa Dua Warna - Novel Interaktif Romantis</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #121016;
      color: #f0e6ed;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* CONTAINER UTAMA */
    .game-container {
      width: 100%;
      max-width: 600px;
      background: #1e1926;
      border: 1px solid #4a3b59;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* HEADER LOVE METER */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(230, 126, 150, 0.2);
      font-size: 0.95rem;
      color: #ff9ebb;
      font-weight: 600;
    }

    /* GAMBAR ADEGAN */
    .scene-image-box {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid #3d2f4a;
    }

    .scene-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease;
    }

    /* KOTAK NARASI */
    .story-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid #362942;
      padding: 18px;
      border-radius: 12px;
      min-height: 130px;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #f5ebf2;
    }

    /* TOMBOL PILIHAN */
    .choices-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-choice {
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 14px 18px;
      background: #2a2035;
      color: #e6b8cb;
      border: 1px solid #ff9ebb;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      transition: all 0.25s ease;
    }

    .btn-choice:hover, .btn-choice:active {
      background: #ff9ebb;
      color: #121016;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 158, 187, 0.3);
    }

    /* RESTART */
    .control-box {
      display: flex;
      justify-content: flex-end;
    }

    .btn-reset {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      background: transparent;
      color: #a38ba0;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-reset:hover {
      color: #ff9ebb;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- BAR STATUS KEDEKATAN -->
    <div class="status-bar">
      <span>📖 Sketsa Dua Warna</span>
      <span>❤️ Kedekatan: <span id="loveMeter">0</span>%</span>
    </div>

    <!-- GAMBAR ADEGAN -->
    <div class="scene-image-box">
      <img id="sceneImg" src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?q=80&w=600" alt="Visual Cerita">
    </div>

    <!-- NARASI TEKS -->
    <div class="story-box" id="storyText">
      Memuat cerita...
    </div>

    <!-- PILIHAN INTERAKSI -->
    <div class="choices-box" id="choicesContainer"></div>

    <!-- RESTART -->
    <div class="control-box">
      <button class="btn-reset" onclick="resetGame()">🔄 Ulangi Cerita</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // ALUR CERITA ROMANTIS: ARIS & LUNA
    // =========================================================================
    const storyData = {
      start: {
        text: "Aroma kopi Arabika menyeruak di kafe 'Selaras'. Kamu (Aris) sedang sibuk dengan cetak biru bangunan di laptopmu. Tiba-tiba pintu kafe terbuka. Luna, seorang ilustrator dengan jaket denim yang agak basah karena hujan, masuk membawa buku sketsa besar. Tempat duduk penuh, kecuali satu kursi di depan mejamu.\n\n'Permisi... boleh saya duduk di sini?' tanya Luna ragu.",
        image: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?q=80&w=600",
        choices: [
          { text: "A. Tersenyum tipis dan menutup sedikit laptop. 'Silakan, duduk saja.'", target: "ramah_2a", love: 20 },
          { text: "B. Mengangguk kaku tanpa ekspresi lalu kembali menatap laptop.", target: "dingin_2b", love: 0 }
        ]
      },

      // --- JALUR A (RAMAH) ---
      ramah_2a: {
        text: "Luna tersenyum lega lalu duduk. Percakapan mengalir hangat seiring rintik hujan di luar. Kamu mengagumi ilustrasi cat airnya yang penuh warna, sementara Luna terpesona dengan cetak birumu yang terstruktur.\n\nSebelum berpisah, kamu memberanikan diri meminta nomor teleponnya, dan Luna mempercayaikannya padamu dengan binar mata bahagia.",
        image: "https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=600",
        choices: [
          { text: "Lanjutkan ke 3 Bulan Kemudian...", target: "proyek_3" }
        ]
      },

      // --- JALUR B (DINGIN) ---
      dingin_2b: {
        text: "Keheningan canggung menyelimuti meja. Luna yang merasa tak enak hati mencoba melukis, namun sikutnya menyenggol cangkir kopi hingga tumpah membasahi cetak biru penting milikmu!\n\n'Ya ampun! Maaf! Maaf sekali!' seru Luna panik.",
        image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=600",
        choices: [
          { text: "A. Menghela napas panjang. 'Sudahlah, nasib buruk. Lain kali hati-hati.'", target: "maaf_2b", love: 5 },
          { text: "B. Menatapnya dingin. 'Ganti rugi tak bisa mengembalikan waktu yang terbuang.'", target: "marah_2b", love: -10 }
        ]
      },
      maaf_2b: {
        text: "Kamu membereskan kertas basah itu lalu pergi. Luna menatap kepergianmu dengan rasa bersalah yang mendalam...",
        image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=600",
        choices: [
          { text: "Lanjutkan ke 3 Bulan Kemudian...", target: "proyek_3" }
        ]
      },
      marah_2b: {
        text: "Luna menunduk malu dan langsung meninggalkan kafe. Pertemuan pertama kalian berakhir buruk.",
        image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=600",
        choices: [
          { text: "Lanjutkan ke 3 Bulan Kemudian...", target: "proyek_3" }
        ]
      },

      // --- PERTEMUAN KEMBALI ---
      proyek_3: {
        text: "Tiga bulan berlalu. Kamu memenangkan proyek galeri seni besar, namun klien meminta lukisan mural raksasa di lobi. Saat rapat gabungan, pintu terbuka dan seniman yang ditunjuk masuk.\n\nGadis itu adalah Luna. Mata kalian saling bertemu dalam rasa terkejut.",
        image: "https://images.unsplash.com/photo-1561214115-f2f134cc4912?q=80&w=600",
        choices: [
          { text: "Mulai mengerjakan proyek mural bersama...", target: "malam_4" }
        ]
      },

      // --- KONFLIK & MENTORSHIP ---
      malam_4: {
        text: "Suatu malam di lokasi proyek yang sepi, perdebatan terjadi. Kamu ingin gaya mural geometris yang rapi, sedangkan Luna ingin warna emosional yang bebas.\n\n'Aris, jika aku mengikuti garis mimpimu, mural ini kehilangan jiwanya,' bisik Luna. Jarak kalian sangat dekat, hingga deru napasnya terasa di pipimu.",
        image: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=600",
        choices: [
          { text: "A. Turunkan ego dan pegang tangannya. 'Kita gabungkan... garisku dan warnamu.'", target: "ending_cinta", love: 40 },
          { text: "B. Mundur selangkah. 'Kita bahas ini besok dengan kepala dingin.'", target: "ending_profesional", love: 10 }
        ]
      },

      // --- ENDING A ---
      ending_cinta: {
        text: "Malam itu berakhir dengan momen manis. Saat galeri resmi dibuka, mural karya kalian memukau semua pengunjung.\n\nDi bawah lukisan itu, kamu menyerahkan kotak kecil berisi cincin perak ukir berpendar batu opal. Luna menerima lamaranmu dengan air mata bahagia.\n\n[HAPPY ENDING: DUA WARNA MENJADI SATU]",
        image: "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?q=80&w=600",
        choices: [
          { text: "🎮 Mainkan Ulang Cerita", target: "start" }
        ]
      },

      // --- ENDING B ---
      ending_profesional: {
        text: "Proyek galeri selesai dengan sukses dan mendapat banyak pujian. Namun hubungan kalian tetap profesional. Ada rasa penasaran dan kehangatan yang tertunda di antara kalian yang belum sempat terungkap.\n\n[NORMAL ENDING: AWAL DARI KISAH BARU]",
        image: "https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?q=80&w=600",
        choices: [
          { text: "🎮 Mainkan Ulang Cerita", target: "start" }
        ]
      }
    };

    // =========================================================================
    // ENGINE
    // =========================================================================
    let gameState = {
      currentNode: 'start',
      love: 0
    };

    const storyTextEl = document.getElementById('storyText');
    const choicesContainerEl = document.getElementById('choicesContainer');
    const sceneImgEl = document.getElementById('sceneImg');
    const loveMeterEl = document.getElementById('loveMeter');
    let typewriterTimer = null;

    function initGame() {
      const saved = localStorage.getItem('romance_save');
      if (saved) {
        gameState = JSON.parse(saved);
      }
      renderNode(gameState.currentNode);
    }

    function renderNode(nodeId) {
      const node = storyData[nodeId];
      if (!node) return;

      gameState.currentNode = nodeId;
      
      if (node.love !== undefined) {
        gameState.love = Math.max(0, Math.min(100, gameState.love + node.love));
      }

      localStorage.setItem('romance_save', JSON.stringify(gameState));
      loveMeterEl.innerText = gameState.love;

      if (node.image) {
        sceneImgEl.src = node.image;
      }

      typeWriterEffect(node.text, () => {
        renderChoices(node.choices);
      });
    }

    function typeWriterEffect(text, onComplete) {
      clearInterval(typewriterTimer);
      storyTextEl.innerText = '';
      choicesContainerEl.innerHTML = '';

      let index = 0;
      typewriterTimer = setInterval(() => {
        if (index < text.length) {
          storyTextEl.innerText += text.charAt(index);
          index++;
        } else {
          clearInterval(typewriterTimer);
          if (onComplete) onComplete();
        }
      }, 20);
    }

    function renderChoices(choices) {
      choicesContainerEl.innerHTML = '';
      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn-choice';
        btn.innerText = choice.text;
        btn.onclick = () => renderNode(choice.target);
        choicesContainerEl.appendChild(btn);
      });
    }

    function resetGame() {
      localStorage.removeItem('romance_save');
      gameState = { currentNode: 'start', love: 0 };
      renderNode('start');
    }

    initGame();
  </script>
</body>
</html>
